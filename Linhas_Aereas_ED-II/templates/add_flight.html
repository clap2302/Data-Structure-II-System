    <!DOCTYPE html>
    <html lang="pt-br">
    <head>
    <meta charset="UTF-8">
    <title>Cadastrar Novo Voo</title>
    <style>
        body {
        font-family: Arial, sans-serif;
        background-color: #f7f9fc;
        margin: 0;
        padding: 40px;
        display: flex;
        flex-direction: column;
        align-items: center;
        }

        .container {
        background: #fff;
        padding: 30px 50px;
        border-radius: 15px;
        box-shadow: 0 0 10px rgba(0,0,0,0.1);
        width: 400px;
        }

        h1 {
        color: #0059ff;
        text-align: center;
        margin-bottom: 25px;
        }

        form {
        display: flex;
        flex-direction: column;
        gap: 10px;
        }

        label {
        font-weight: bold;
        margin-top: 5px;
        }

        input {
        padding: 8px;
        border-radius: 6px;
        border: 1px solid #ccc;
        transition: border-color 0.2s;
        }

        input:focus {
        border-color: #0059ff;
        outline: none;
        }

        button {
        background-color: #0059ff;
        color: white;
        border: none;
        padding: 10px;
        border-radius: 6px;
        cursor: pointer;
        font-size: 15px;
        margin-top: 15px;
        transition: 0.3s;
        }

        button:hover {
        background-color: #003ec4;
        }

        .top-link {
        text-align: left;
        width: 100%;
        margin-bottom: 20px;
        }

        .top-link a {
        color: #0059ff;
        font-weight: bold;
        text-decoration: none;
        }

        .top-link a:hover {
        text-decoration: underline;
        }

        .error {
        color: red;
        text-align: center;
        font-weight: bold;
        }
    </style>
    </head>

    <body>
    <div class="top-link">
        <a href="{{ url_for('flights_bp.flight_management') }}">⬅️ Voltar à lista de voos</a>
    </div>

    <div class="container">
        <h1>Cadastrar Novo Voo</h1>

        {% if error %}
        <p class="error">{{ error }}</p>
        {% endif %}

        <form method="POST">
        <label for="flight_code">Código:</label>
        <input type="text" id="flight_code" name="flight_code" required>

        <label for="origin">Origem:</label>
        <input type="text" id="origin" name="origin" required>

        <label for="destiny">Destino:</label>
        <input type="text" id="destiny" name="destiny" required>

        <label for="miles">Milhas:</label>
        <input type="number" id="miles" name="miles" required>

        <label for="ticket_price">Preço:</label>
        <input type="number" id="ticket_price" name="ticket_price" step="0.01" required>

        <label for="airplane_type">Tipo de avião:</label>
        <input type="text" id="airplane_type" name="airplane_type" required>

        <label for="num_seats">Número de assentos:</label>
        <input type="number" id="num_seats" name="num_seats" required>

        <button type="submit">Salvar Voo</button>
        </form>
    </div>
    </body>
    </html>
