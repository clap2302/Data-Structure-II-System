<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Usuário</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4a90e2, #0059ff);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
        margin: 0;
    }

    .register-container {
        background-color: #fff;
        padding: 40px 50px;
        border-radius: 15px;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
        width: 340px;
        text-align: center;
    }

    h1 {
        margin-bottom: 25px;
        color: #0059ff;
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }

    input[type="text"],
    input[type="password"] {
        width: 90%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
        transition: 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #0059ff;
        box-shadow: 0 0 5px rgba(0, 89, 255, 0.5);
    }

    input[type="submit"] {
        background-color: #0059ff;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 20px;
        font-size: 16px;
        transition: 0.3s;
    }

    input[type="submit"]:hover {
        background-color: #003ec4;
    }

    .back-link {
        margin-top: 15px;
        font-size: 14px;
    }

    .back-link a {
        color: #0059ff;
        text-decoration: none;
        font-weight: bold;
    }

    .back-link a:hover {
        text-decoration: underline;
    }

    .msg {
        color: green;
        margin-top: 10px;
        font-weight: bold;
    }
    </style>
</head>

<body>
    <div class="register-container">
    <h1>📝 Cadastro</h1>
    <form method="POST" action="{{ url_for('login_bp.register') }}">
        
        <label>Nome:</label><br>
        <input type="text" name="name" required><br>

        <label>CPF:</label><br>
        <input type="text" name="cpf" required><br>

        <label>Usuário:</label><br>
        <input type="text" name="user" required><br>

        <label>Senha:</label><br>
        <input type="password" name="password" required><br>

        <label>Tipo:</label><br>
        <select name="role">
            <option value="user">Usuário comum</option>
        </select><br><br>

        <input type="submit" value="Cadastrar">
    </form>
    </form>

    {% if msg %}
        <p class="msg">{{ msg }}</p>
    {% endif %}

    <div class="back-link">
        Já tem conta? <a href="{{ url_for('login_bp.login') }}">Voltar ao login</a>.
    </div>
    </div>
</body>
</html>
