<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Painel Administrativo</title>
    <style>
        /* Variáveis de Cores */
        :root {
            --primary-color: #0059ff;
            --primary-dark: #003ec4;
            --secondary-color: #f7f7f7;
            --text-color: #333;
            --header-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            --card-shadow: 0 4px 12px rgba(0, 0, 0, 0.05);
        }

        /* Estilo Base */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--secondary-color);
            margin: 0;
            padding: 0;
            line-height: 1.6;
        }

        h1, h2 {
            margin-top: 0;
        }

        /* Cabeçalho */
        header {
            background-color: var(--primary-color);
            color: white;
            padding: 15px 40px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: var(--header-shadow);
            position: sticky;
            top: 0;
            z-index: 1000;
        }

        header h1 {
            margin: 0;
            font-size: 1.8em;
            font-weight: 600;
            color: white;
        }

        header .links {
            display: flex;
            gap: 15px;
        }

        header a {
            text-decoration: none;
            background: white;
            color: var(--primary-color);
            font-weight: 600;
            padding: 8px 18px;
            border-radius: 25px;
            transition: all 0.3s ease;
            white-space: nowrap; /* Evita quebras de linha em links */
            text-align: center;
        }

        header a:hover {
            background: var(--primary-dark);
            color: white;
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.2);
        }

        /* Conteúdo Principal */
        .container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }
        
        /* Card do Painel */
        .card {
            background: white;
            border-radius: 12px;
            padding: 30px;
            box-shadow: var(--card-shadow);
            max-width: 600px; /* Limita a largura do painel para elegância */
            margin: 0 auto; /* Centraliza o card */
        }

        .card h2 {
            color: var(--primary-dark);
            font-size: 1.5em;
            border-bottom: 2px solid #eee;
            padding-bottom: 10px;
            margin-bottom: 20px;
        }

        .panel {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* Links do Painel (Botões) */
        .panel a {
            display: flex;
            align-items: center;
            justify-content: center;
            background: var(--primary-color);
            color: white;
            text-decoration: none;
            padding: 15px 20px;
            border-radius: 8px;
            font-weight: 600;
            font-size: 1.1em;
            transition: background 0.3s ease, transform 0.1s ease;
        }
        
        .panel a:hover {
            background: var(--primary-dark);
            transform: translateY(-2px);
        }

        /* Estilo do Formulário */
        input[type="submit"] {
            background-color: var(--primary-color);
            color: #fff;
            padding: 10px 20px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 10px;
            font-size: 16px;
            font-weight: 600;
            transition: 0.3s;
        }

        input[type="submit"]:hover {
            background-color: var(--primary-dark);
        }
    </style>
</head>
<body>

    <header>
        <h1>Administrador</h1>

        <div class="links">
            <a href="{{ url_for('home_bp.home') }}">Home</a>
            <a href="{{ url_for('login_bp.logout') }}">Sair</a>
        </div>
    </header>

    <div class="container">
        <div class="card">
            <h2>Gestão de Voos ✈️</h2>
            <div class="panel">
                <a href="{{ url_for('flights_bp.flight_management') }}">Listar Voos</a>
                <a href="{{ url_for('flights_bp.add_flight') }}">Adicionar Novo Voo</a>
            </div>

            <h2 style="margin-top: 30px;">Gestão de Usuários 👥</h2>
            <div class="panel">
                <a href="{{ url_for('login_bp.admin', user=session['user']) }}">Gerenciar Usuários</a>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
