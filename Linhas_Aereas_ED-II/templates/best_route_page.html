<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8" />
  <title>Melhor Rota</title>

  <!-- Fonte bonita -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;700&display=swap" rel="stylesheet">

  <style>
    body {
      font-family: 'Inter', sans-serif;
      background: linear-gradient(135deg, #dce9ff, #f4f8ff);
      margin: 0;
      padding: 40px 20px;
    }

    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      max-width: 800px;
      margin: auto;
      box-shadow: 0 6px 20px rgba(0,0,0,0.12);
      animation: fadeIn 0.5s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    h2 {
      margin-top: 0;
      color: #1a3d7c;
      text-align: center;
      font-size: 28px;
    }

    form {
      display: grid;
      gap: 10px;
      margin-bottom: 25px;
    }

    label {
      font-weight: 600;
      color: #1a3d7c;
    }

    input {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #bfcde0;
      font-size: 15px;
      transition: 0.3s;
    }

    input:focus {
      border-color: #4c8cff;
      outline: none;
      box-shadow: 0 0 4px rgba(76,140,255,0.4);
    }

    button {
      margin-top: 10px;
      padding: 12px 18px;
      background: #1a73e8;
      border: none;
      color: white;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: 0.25s;
    }

    button:hover {
      background: #0d5ec4;
      transform: translateY(-1px);
    }

    hr {
      margin: 25px 0;
      border: none;
      border-top: 1px solid #e1e7f0;
    }

    .route-step {
      padding: 12px;
      background: #eef4ff;
      margin-bottom: 8px;
      border-radius: 8px;
      font-weight: 600;
      border-left: 5px solid #1a73e8;
    }

    .arrow {
      font-size: 24px;
      color: #1a73e8;
      text-align: center;
      margin: 6px 0;
    }

    .distance-box {
      margin-top: 20px;
      padding: 15px;
      background: #e9f3ff;
      border-radius: 10px;
      font-size: 17px;
      border-left: 5px solid #1a73e8;
    }

    .map-box {
      width: 100%;
      height: 500px;
      margin-top: 30px;
      border-radius: 12px;
      overflow: hidden;
      box-shadow: 0 6px 15px rgba(0,0,0,0.2);
    }
  </style>
</head>
<body>

<div class="card">

  <h2>🚀 Melhor Rota Encontrada</h2>

  


  {% if result %}

    <h3>🛫 Rota Completa:</h3>

    {% for node in result.route %}
      <div class="route-step">{{ node }}</div>
      {% if not loop.last %}
        <div class="arrow">↓</div>
      {% endif %}
    {% endfor %}

    <div class="distance-box">
      <strong>Distância total:</strong> {{ result.distance_km|round(2) }} km
    </div>

    <div class="map-box">
      <iframe 
          src="{{ url_for('static', filename='best_route.html') }}"
          style="width:100%; height:100%; border:none;">
      </iframe>
    </div>

  {% else %}
    <p style="color:#444; text-align:center;">Preencha origem e destino para calcular a melhor rota.</p>
  {% endif %}


  <hr>

  <form method="get">
    <label>Origem:</label>
    <input type="text" name="origin" value="{{ origin or '' }}" required>
    
    <label>Destino:</label>
    <input type="text" name="destiny" value="{{ destiny or '' }}" required>

    <button type="submit">Calcular Rota</button>
  </form>

</div>

</body>
</html>
