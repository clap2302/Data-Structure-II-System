<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Login</title>
    <style>
    body {
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #4a90e2, #0059ff);
        height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        color: #333;
        margin: 0;
    }

    button {
            background-color: #fff;
            color: #0059ff;
            padding: 5px 10px;
            border: 2px solid #0059ff;
            border-radius: 6px;
            cursor: pointer;
            margin-top: 20px;
            font-size: 15px;
            transition: 0.3s;
    }

    button:hover{
        background-color: #aaaaaa;
    }

    .login-container {
        background-color: #fff;
        padding: 40px 50px;
        border-radius: 15px;
        box-shadow: 0 0 15px rgba(0,0,0,0.2);
        width: 320px;
        text-align: center;
    }

    h1 {
        margin-bottom: 25px;
        color: #0059ff;
    }

    label {
        display: block;
        margin-top: 10px;
        font-weight: bold;
    }

    input[type="text"],
    input[type="password"] {
        width: 90%;
        padding: 10px;
        margin-top: 5px;
        border: 1px solid #ccc;
        border-radius: 6px;
        outline: none;
        transition: 0.2s;
    }

    input[type="text"]:focus,
    input[type="password"]:focus {
        border-color: #0059ff;
        box-shadow: 0 0 5px rgba(0, 89, 255, 0.5);
    }

    input[type="submit"] {
        background-color: #0059ff;
        color: #fff;
        padding: 10px 20px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        margin-top: 20px;
        font-size: 16px;
        transition: 0.3s;
    }

    input[type="submit"]:hover {
        background-color: #003ec4;
    }

    .error {
        color: red;
        font-weight: bold;
        margin-top: 15px;
    }

        .register-link {
        margin-top: 20px;
        font-size: 14px;
        }

        .register-link a {
        color: #0059ff;
        text-decoration: none;
        font-weight: bold;
        }

        .register-link a:hover {
        text-decoration: underline;
        }
    </style>
</head>

<body>
    <div class="login-container">
    <h1>🔐 Login</h1>
    <form method="post" action="{{ url_for('login_bp.login') }}">
        <label for="user">Usuário:</label>
        <input type="text" id="user" name="user" required>

        <label for="password">Senha:</label>
        <input type="password" id="password" name="password" required>

        <input type="submit" value="Entrar">
    </form>

    {% if erro %}
        <p class="error">{{ erro }}</p>
    {% endif %}

        <div class="register-link">
        Não tem cadastro?
        <a href="{{ url_for('login_bp.register_page') }}">Cadastre-se</a>.
        <div>
        <a href="{{ url_for('home_bp.home') }}"><button>Home</button></a>
        </div>
        </div>

    <footer style="margin-top:15px; font-size:12px; color:#777;">
        Sistema Linhas Aéreas ED-II ✈️
    </footer>

    </div>
</body>
</html>
